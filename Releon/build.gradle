plugins {
    id "fabric-loom" version "1.7.4"
    id "java"
}

base {
    archivesName = "releon"
}

version = project.mod_version
group = "fat.releon"

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "MixinExtras"
        url = "https://jitpack.io"
    }
    maven {
        name = "meteor-maven"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "meteor-maven-snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.119.2+1.21.4"
    modImplementation "meteordevelopment:baritone:1.21.4-SNAPSHOT"
    implementation "io.github.llamalad7:mixinextras-fabric:0.4.1"
    annotationProcessor "io.github.llamalad7:mixinextras-fabric:0.4.1"
    include "io.github.llamalad7:mixinextras-fabric:0.4.1"
    implementation "org.java-websocket:Java-WebSocket:1.5.6"
    implementation "io.netty:netty-handler-proxy:4.1.82.Final"
    implementation "io.netty:netty-codec-socks:4.1.82.Final"
    implementation "dev.redstones.mediaplayerinfo:media-player-info:0.1.0"
    include "org.java-websocket:Java-WebSocket:1.5.6"
    include "io.netty:netty-handler-proxy:4.1.82.Final"
    include "io.netty:netty-codec-socks:4.1.82.Final"
    include "dev.redstones.mediaplayerinfo:media-player-info:0.1.0"
    modImplementation files("libs/nether-pathfinder-1.4.1.jar")
    include files("libs/nether-pathfinder-1.4.1.jar")
}

loom {
    accessWidenerPath = file("src/main/resources/accesswidener")

    mixin {
        defaultRefmapName = "rich-refmap.json"
    }

    runs {
        client {
            client()
            setConfigName("Minecraft Client")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
