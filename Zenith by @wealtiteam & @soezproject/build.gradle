plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    accessWidenerPath = file("src/main/resources/zenith.accesswidener")

    mixin {
        // Keep the generated refmap name aligned with zenithdlc.mixins.json.
        // Without this, Loom generates zenith-refmap.json and Fabric logs a
        // missing zenithdlc-refmap.json warning during every dev startup.
        defaultRefmapName = "zenithdlc-refmap.json"
    }

    runs {
        client {
            // Воспроизводим окружение штатного лаунчера (.runtime/launch.args.template):
            // weye-session.dll грузит зависимые нативы из этой папки.
            // Путь условный: на машинах без оригинального лаунчера loom использует свои нативы.
            def zenithNatives = 'C:/Users/aleks/Desktop/Zenith_1.21.4_Offline/client/runtime-dependencies/native-dependencies'
            if (file(zenithNatives).exists()) {
                vmArgs(
                    "-Djava.library.path=${zenithNatives}",
                    "-Dorg.lwjgl.librarypath=${zenithNatives}",
                    '-DDevMode=true'
                )
            } else {
                vmArgs('-DDevMode=true')
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.viaversion.com' }
    maven { url = 'https://repo.viaversion.com' }
    maven { url = 'https://maven.lenni0451.net/everything' }
    maven { url = 'https://jitpack.io' }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // библиотеки, вшитые в готовый jar (восстановлены из сборки)
    // -fixed: у оригинала стёрты StackMapTable при major=52 -> VerifyError на старте.
    // Пересобран утилитой scratchpad/FrameFixer.java (ASM COMPUTE_FRAMES).
    implementation files('libs/zenith-shaded-deps-fixed.jar')

    // моды-зависимости из META-INF/jars (ремап делает loom)
    modImplementation files('libs/baritone-1.21.4-SNAPSHOT.jar')
    modImplementation files('libs/player-animation-lib-fabric-2.0.3.1+1.21.4.jar')
    modImplementation files('libs/zenith-addon-api-1.0-SNAPSHOT.jar')
    modImplementation files('libs/zenith-addon-runtime-1.0-SNAPSHOT.jar')
    modImplementation files('libs/zenith-figura-runtime-0.1.6-zenith.4+1.21.4.jar')
    // Baritone возит nether-pathfinder внутри META-INF/jars (Fabric JiJ);
    // в dev-запуске вложенные jar-ы не подключаются, поэтому явно.
    modImplementation files('libs/nether-pathfinder-1.4.1.jar')

    implementation 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'

    // project.weye.* нужен и в рантайме (org.zenith.Var159_Var159), поэтому
    // implementation, а не compileOnly; копии лежат в libs/, чтобы не зависеть
    // от абсолютного пути к папке Zenith_1.21.4_Offline.
    // NB: weye-launcher.jar исключён — все его классы упакованы протектором
    // (major version 22341/0), JVM их не грузит, а tiny-remapper на них падает.
    implementation files('libs/weye-session.jar')
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
    // декомпилированный код: не валимся на предупреждениях
    it.options.compilerArgs += ['-nowarn', '-Xlint:none', '-Xmaxerrs', '2000']
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
