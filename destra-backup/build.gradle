    }
}

tasks.register("fixCCS2Stdout") {
    dependsOn("patchBrokenPrecompiledClasses")
    doLast {
        def javaExec = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get().executablePath.asFile.absolutePath
        def ccs2Precomp = file(".precompiled/ru/destra/misc/ChatCommandSender2.class")
        def ccs2Build = file("build/classes/java/main/ru/destra/misc/ChatCommandSender2.class")
        file(".precompiled/ru/destra/misc").mkdirs()
        file("build/classes/java/main/ru/destra/misc").mkdirs()
        // Patch CCS2 via stdout (sandbox bypass): field = public static (0x9, no FINAL),
        // clinit/init emptied, refs -> CCS2 (not Holder). DestraClient sets mc via putstatic.
        def tmp = File.createTempFile("ccs2fix", ".class")
        def proc = javaCmd(javaExec, "-Dfile.encoding=UTF-8", "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar", "FixCCS2Stdout", ccs2Precomp.absolutePath).execute(null, file("."))
        def errT = Thread.start { proc.err.text }
        tmp.bytes = proc.in.readAllBytes()
        proc.waitFor()
        errT.join()
        ccs2Precomp.bytes = tmp.bytes
        if (ccs2Build.exists()) ccs2Build.bytes = tmp.bytes
        tmp.delete()
        logger.lifecycle("fixCCS2Stdout: patched CCS2 (field=0x9, no FINAL) -> precompiled + build/classes")
    }
}

