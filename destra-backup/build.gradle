}

tasks.register("recomputeFramesAfterFixes") {
    dependsOn("patchBrokenPrecompiledClasses")
    doLast {
        def javaExec = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get().executablePath.asFile.absolutePath
        // Recompute frames AFTER fixPublicMethods/fixModuleInit/fixDeltaTime/fixPlayerHeadFeature
        // rewrote bytecode in .precompiled (those patches add/remove instructions but don't emit
        // Recompute frames AFTER fixPublicMethods/fixModuleInit/fixDeltaTime/fixPlayerHeadFeature
        // rewrote bytecode in .precompiled (those patches add/remove instructions but don't emit
        // StackMapTable, causing VerifyError on tableswitch/branches in Java 21 classes).
        // Pass minecraft intermediary jar so getCommonSuperClass can resolve net/minecraft/class_*
        // hierarchy (needed for correct LCA in frame computation).
        def mcIntermediaryJar = file("${System.getProperty('user.home')}/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-intermediary/1.21.4-net.fabricmc.yarn.1_21_4.1.21.4+build.8-v2/minecraft-merged-intermediary-1.21.4-net.fabricmc.yarn.1_21_4.1.21.4+build.8-v2.jar")
        exec {
            commandLine(javaExec, "-Dfile.encoding=UTF-8", "-Dextra.classpath=${mcIntermediaryJar.absolutePath}", "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar", "RecomputeAllFrames")
        }
    }
}

tasks.register("fixPublicMethods") {
    dependsOn("patchBrokenPrecompiledClasses")
    doLast {
        def javaExec = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get().executablePath.asFile.absolutePath
        def buildOut = "build/classes/java/main"
        // Make ALL methods+fields public across entire ru/destra tree — fixes all IllegalAccessError
        // in dev env (production jar allows same-module private access, dev env does not).
        def cmd = [javaExec, "-Dfile.encoding=UTF-8", "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar",
                   "PatchBatchPublic", "--build", buildOut, ".precompiled/ru/destra"]
        exec {
            commandLine(cmd)
        }
        // Patch WorldParticlesModule.getTextureId with hardcoded texture paths (obfuscated strings are null)
        def wp = file(".precompiled/ru/destra/module/WorldParticlesModule.class")
        def tmpWp = File.createTempFile("wpTex", ".class")
        def procWP = javaCmd(javaExec, "-Dfile.encoding=UTF-8", "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar", "PatchWorldParticlesStdout", wp.absolutePath).execute(null, file("."))
        def errWP = Thread.start { procWP.err.text }
        tmpWp.bytes = procWP.in.readAllBytes()
        procWP.waitFor()
        errWP.join()
        wp.bytes = tmpWp.bytes
        file("${buildOut}/ru/destra/module/WorldParticlesModule.class").bytes = tmpWp.bytes
        tmpWp.delete()
        // Patch WorldParticlesModule setting names with real Cyrillic labels (obfuscated static
        // strings are null in production -> safeName falls back to "Boolean"/"Number" -> every
        // mode toggle shows "boolean" instead of the real label). Run after the texture patch.
        exec {
            commandLine(javaExec, "-Dfile.encoding=UTF-8", "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar",
                "PatchWorldParticlesModeNames", wp.absolutePath)
        }
        file("${buildOut}/ru/destra/module/WorldParticlesModule.class").bytes = wp.bytes
        // Fix null setting-name fields across ALL modules. The decompiler mangled obfuscated
        // Cyrillic field names differently in <clinit> (PUTSTATIC) vs <init> (GETSTATIC) —
        // homoglyphs like И vs Й, х vs с. The clinit writes to one field, the constructor reads
        // a different (look-alike) field -> null at runtime -> safeName falls back to "Boolean".
        // This matches null-read fields to the most-similar clinit-written field (homoglyph match)
        // and injects the value as LDC. For readable-named constants the decompiler forgot to
        // initialize (AUTO_SEARCH_SETTING_NAME etc.), derives a label from the field name.
        exec {
            commandLine(javaExec, "-Dfile.encoding=UTF-8", "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar",
                "FixNullSettingNames", ".precompiled/ru/destra")
        }
        logger.lifecycle("fixPublicMethods: all classes patched public + WorldParticles textures + mode names + null setting names")
    }
}

tasks.register("fixModuleInit") {
    dependsOn("patchBrokenPrecompiledClasses")
    doLast {
        def javaExec = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get().executablePath.asFile.absolutePath
        // PatchClickGuiColorSupplier — constructor body stripped, AnimatedColor fields null -> NPE crash
        def cgs = file(".precompiled/ru/destra/gui/ClickGuiColorSupplier.class")
        if (cgs.exists()) {
            def tmp = File.createTempFile("cgsPatched", ".class")
            def proc = javaCmd(javaExec, "-Dfile.encoding=UTF-8", "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar", "PatchClickGuiColorSupplier", cgs.absolutePath, tmp.absolutePath).execute(null, file("."))
            def errT = Thread.start { proc.err.text }
            proc.waitFor()
            errT.join()
            if (tmp.length() > 100) {
                cgs.bytes = tmp.bytes
                file("build/classes/java/main/ru/destra/gui").mkdirs()
                file("build/classes/java/main/ru/destra/gui/ClickGuiColorSupplier.class").bytes = tmp.bytes
            }
            tmp.delete()
        }
        logger.lifecycle("fixModuleInit: ClickGuiColorSupplier (AnimatedColor init)")

        // Patch CrosshairModule.<clinit> — crosshairPixels static field never initialized -> null
        // matrix -> NPE when opening crosshair settings (11x11 grid editor). Inject resetToDefaultMatrix()
        // call before <clinit> RETURN. Backstop for CrosshairModuleInitMixin (mixin is primary fix).
        def cm = file(".precompiled/ru/destra/module/CrosshairModule.class")
        if (cm.exists()) {
            def tmpM = File.createTempFile("cmPatched", ".class")
            def procM = javaCmd(javaExec, "-Dfile.encoding=UTF-8", "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar", "PatchCrosshairMatrixInit", cm.absolutePath, tmpM.absolutePath).execute(null, file("."))
            def errM = Thread.start { procM.err.text }
            procM.waitFor()
            errM.join()
            if (tmpM.length() > 100) {
                cm.bytes = tmpM.bytes
                file("build/classes/java/main/ru/destra/module").mkdirs()
                file("build/classes/java/main/ru/destra/module/CrosshairModule.class").bytes = tmpM.bytes
            }
            tmpM.delete()
        }
        logger.lifecycle("fixModuleInit: CrosshairModule (crosshairPixels matrix init)")
    }
}

