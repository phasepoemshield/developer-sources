tasks.register("injectRefmap") {
    doLast {
        def refmapFile = file("build/refmap-merged.json")
        def jarFile = file("build/libs/${project.archives_base_name}-${project.mod_version}.jar")
        if (!refmapFile.exists()) {
            logger.warn("Refmap not found: ${refmapFile}")
            return
        }
        if (!jarFile.exists()) {
            logger.warn("JAR not found: ${jarFile}")
            return
        }
        def javaExec = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get().executablePath.asFile.absolutePath
        exec {
            commandLine(
                javaExec,
                "-Dfile.encoding=UTF-8",
                "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar",
                "InjectRefmap",
                refmapFile.absolutePath,
                jarFile.absolutePath,
                ".precompiled"
            )
            ignoreExitValue = true
        }
        // Fix ChatCommandSender2 access flags (remapJar strips ACC_ABSTRACT from interfaces)
        exec {
            commandLine(
                javaExec,
                "-Dfile.encoding=UTF-8",
                "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar",
                "FixChatCommandSender2",
                jarFile.absolutePath
            )
            ignoreExitValue = false
        }
        // FixCCS2Field: removes the illegal 0x9 (public+static, no final) mc field from the CCS2
        // interface and moves it to ChatCommandSender2Fields holder. Uses Files.newOutputStream
        // to write the jar (Files.copy with REPLACE_EXISTING is virtualized on this machine).
        exec {
            commandLine(
                javaExec,
                "-Dfile.encoding=UTF-8",
                "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar",
                "FixCCS2Field"
            )
            ignoreExitValue = false
        }
        // Note: do NOT delete ChatCommandSender2 — ~110 classes still reference it (method calls,
        // implements). FixChatCommandSender2 already removed the illegal 0x9 field, making CCS2
        // a valid interface (no fields). Deleting it would cause NoClassDefFoundError.
    }
}

