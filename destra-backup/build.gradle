tasks.register("fixCCS2") {
    dependsOn("patchBrokenPrecompiledClasses")
    doLast {
        def javaExec = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get().executablePath.asFile.absolutePath
        exec {
            commandLine(javaExec, "-Dfile.encoding=UTF-8", "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar", "FixChatCommandSender2", ".precompiled/ru/destra/misc/ChatCommandSender2.class")
        }
    }
}

tasks.register("syncPrecompiledClasses", Copy) {
    dependsOn("fixCCS2")
    from(".precompiled")
    into(layout.buildDirectory.dir("classes/java/main"))
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    exclude { FileTreeElement details -> details.relativePath && details.relativePath.toString().replace('\\', '/') == 'sg/mx/GameRendererMixin.class' }
    doLast {
        def grm = file("build/classes/java/main/sg/mx/GameRendererMixin.class")
        if (grm.exists()) {
            grm.delete()
            logger.lifecycle("syncPrecompiledClasses: deleted stale precompiled GameRendererMixin from build/classes (will be recompiled from source)")
        }
    }
}

tasks.register("forceCopySgEc") {
    dependsOn("patchBrokenPrecompiledClasses")
    doLast {
        def src = file(".precompiled/sg/ec")
        def dst = file("build/classes/java/main/sg/ec")
        if (src.exists()) {
            dst.mkdirs()
            int count = 0
            src.eachFile { f ->
                if (f.name.endsWith(".class")) {
                    def target = new File(dst, f.name)
                    if (!target.exists()) {
                        target.bytes = f.bytes
                        count++
                    }
                }
            }
            logger.lifecycle("forceCopySgEc: copied ${count} files")
        }
    }
}

tasks.register("forceCopyMixins") {
    dependsOn("patchBrokenPrecompiledClasses")
    doLast {
        def srcDir = file(".precompiled/sg/mx")
        def dstDir = file("build/classes/java/main/sg/mx")
        if (srcDir.exists()) {
            dstDir.mkdirs()
            int count = 0
            // Copy all .class files, but SKIP ones already compiled by Loom (they have refmap)
            def skipIfCompiled = ["OverlayTextureMixin.class", "ModuleHelper.class", "EquipmentRendererMixin.class", "LivingEntityRendererChamsMixin.class", "NetworkManagerMixin.class", "ChamsRenderer.class", "KeybindElement.class", "ScoreboardHudModule.class", "TextRenderCallback.class", "ClickGuiElement.class", "GuiInputElement.class", "Account.class", "FakePlayerModule.class", "GameRendererMixin.class", "WorldRendererSkyShaderMixin.class"]
            srcDir.eachFile { f ->
                if (f.name.endsWith(".class")) {
                    def target = new File(dstDir, f.name)
                    if (skipIfCompiled.contains(f.name) && target.exists()) {
                        // Skip - Loom already compiled this with refmap
                        logger.lifecycle("forceCopyMixins: skipping ${f.name} (already compiled by Loom)")
                    } else {
                        target.bytes = f.bytes
                        count++
                    }
                }
            }
            // Copy ModuleHelper.class to ru/destra/misc (skip if Loom compiled it from src/main/java)
            def mhSrc = file(".precompiled/ru/destra/misc/ModuleHelper.class")
            def mhDst = file("build/classes/java/main/ru/destra/misc/ModuleHelper.class")
            if (mhSrc.exists() && !mhDst.exists()) {
                mhDst.parentFile.mkdirs()
                mhDst.bytes = mhSrc.bytes
                logger.lifecycle("forceCopyMixins: copied ModuleHelper.class (${mhSrc.length()} bytes)")
            } else if (mhDst.exists()) {
                logger.lifecycle("forceCopyMixins: skipping ModuleHelper.class (compiled from src/main/java)")
            }
            logger.lifecycle("forceCopyMixins: copied ${count} files total")
        }
    }
}

