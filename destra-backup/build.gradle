        def skipIfCompiled = ["OverlayTextureMixin.class", "ModuleHelper.class", "EquipmentRendererMixin.class", "LivingEntityRendererChamsMixin.class", "NetworkManagerMixin.class", "ChamsRenderer.class", "KeybindElement.class", "ScoreboardHudModule.class", "GameRendererMixin.class"]
