tasks.register("collectDiagnostics") {
    group = "verification"
    description = "Collects the latest client logs, crash reports, and recovery audit."

    doLast {
        def diagnosticsDir = layout.buildDirectory.dir("diagnostics").get().asFile
        diagnosticsDir.mkdirs()

        def latestLog = file("run/logs/latest.log")
        def stdoutLog = file("build/interactive-client.out.log")
        def stderrLog = file("build/interactive-client.err.log")
        def auditLog = file("build/recovery-bytecode-audit.txt")
        def crashDir = file("run/crash-reports")
        def latestCrash = crashDir.exists()
            ? crashDir.listFiles()
                .findAll { it.isFile() && it.name.endsWith(".txt") }
                .sort { a, b -> b.lastModified() <=> a.lastModified() }
                .find()
            : null

        def report = new StringBuilder()
        report.append("Destra diagnostic report\n")
        report.append("Generated: ${new Date().format("yyyy-MM-dd HH:mm:ss Z")}\n")
        report.append("Minecraft: ${project.minecraft_version}\n")
        report.append("Java target: 21\n\n")

        def appendFile = { String title, File source ->
            report.append("===== ${title} =====\n")
            if (source != null && source.exists()) {
                report.append(source.getText("UTF-8"))
            } else {
                report.append("<not available>\n")
            }
            report.append("\n\n")
        }

        appendFile("LATEST LOG", latestLog)
        appendFile("LATEST CRASH REPORT", latestCrash)
        appendFile("GRADLE STDOUT", stdoutLog)
        appendFile("GRADLE STDERR", stderrLog)
        appendFile("BYTECODE AUDIT", auditLog)

        def reportFile = new File(diagnosticsDir, "latest-report.txt")
        reportFile.setText(report.toString(), "UTF-8")

        def errorSummary = new File(diagnosticsDir, "error-summary.txt")
        def summaryLines = report.toString()
            .readLines()
            .findAll {
                it.contains("/ERROR]")
                    || it.contains("/WARN]")
                    || it.contains("Exception")
                    || it.contains("Error:")
                    || it.startsWith("Caused by:")
            }
        errorSummary.setText(summaryLines.join(System.lineSeparator()), "UTF-8")

        logger.lifecycle("Diagnostics written to ${reportFile}")
    }
}

