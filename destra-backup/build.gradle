plugins {
    id "fabric-loom" version "1.10.5"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def runtimeJavaVersion = JavaLanguageVersion.of(21)
def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
def toJavac = { String javaPath ->
    if (javaPath.endsWith("java.exe")) return javaPath.replace("java.exe", "javac.exe")
    if (javaPath.endsWith("/java") || javaPath.endsWith("\\java")) return javaPath[0..-5] + "javac"
    return javaPath.replace("java", "javac")
}
def javaCmd = { Object... args ->
    def list = args.collect { it as String }
    return isWindows ? (["cmd", "/c"] + list) : list
}

loom {
    runs {
        client {
            client()
            setConfigName("Minecraft Client")
            ideConfigGenerated = true
            runDir "run"
        }
    }
}

configurations {
    precompiledClasses
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"

    compileOnly files(".precompiled")
    precompiledClasses files(".precompiled")
}

