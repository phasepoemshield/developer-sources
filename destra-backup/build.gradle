tasks.register("fixDeltaTime") {
    dependsOn("patchBrokenPrecompiledClasses")
    doLast {
        def javaExec = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get().executablePath.asFile.absolutePath
        def interpPrecomp = file(".precompiled/ru/destra/animation/Interpolation.class")
        def iuPrecomp = file(".precompiled/ru/destra/animation/InterpolationUtil.class")
        // Patch getDeltaTime()/6() to return stable 0.05 (1 tick) — fixes animation jitter
        // caused by unstable RenderTickCounter.getLastDuration() in dev env.
        def tmp1 = File.createTempFile("interp", ".class")
        def p1 = javaCmd(javaExec, "-Dfile.encoding=UTF-8", "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar", "PatchDeltaTimeStdout", interpPrecomp.absolutePath).execute(null, file("."))
        def err1 = Thread.start { p1.err.text }
        tmp1.bytes = p1.in.readAllBytes()
        p1.waitFor()
        err1.join()
        interpPrecomp.bytes = tmp1.bytes
        file("build/classes/java/main/ru/destra/animation").mkdirs()
        file("build/classes/java/main/ru/destra/animation/Interpolation.class").bytes = tmp1.bytes
        def tmp2 = File.createTempFile("interpUtil", ".class")
        def p2 = javaCmd(javaExec, "-Dfile.encoding=UTF-8", "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar", "PatchDeltaTimeStdout", iuPrecomp.absolutePath).execute(null, file("."))
        def err2 = Thread.start { p2.err.text }
        tmp2.bytes = p2.in.readAllBytes()
        p2.waitFor()
        err2.join()
        iuPrecomp.bytes = tmp2.bytes
