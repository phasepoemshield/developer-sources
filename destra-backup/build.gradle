        // Remap mixin targets back to named (yarn) so they resolve in the Loom dev environment (runClient).
        // PatchAllToIntermediary converts @Mixin targets to intermediary (class_XXX) which only works in
        // the production remapped jar. For runClient (named mappings), targets must be yarn names.
        exec {
            commandLine(javaExec, "-Dfile.encoding=UTF-8", "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar", "PatchAllToNamed")
        }
    }
}

tasks.named("compileJava") {
    dependsOn("patchMixinsToIntermediary")
    mustRunAfter("syncPrecompiledClasses")
}

tasks.register("generateMixinRefmap") {
    dependsOn("compileJava")
    doLast {
        def javaExec = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get().executablePath.asFile.absolutePath
        exec {
            commandLine(
                javaExec,
                "-Dfile.encoding=UTF-8",
                "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar",
                "GenerateRefmap"
            )
        }
        // Copy refmap to resources/main so jar includes it and remapJar can use it
        def refmap = file("build/classes/java/main/destra-recovered-refmap.json")
        def resDir = file("build/resources/main")
        resDir.mkdirs()
        if (refmap.exists()) {
            def dst = new File(resDir, "destra-recovered-refmap.json")
            dst.text = refmap.text
            logger.lifecycle("Copied refmap to ${dst} (${refmap.length()} bytes)")
            // Also save backup
            file("build/refmap-merged.json").text = refmap.text
        }
        // Rename @Shadow fields to intermediary names using the freshly generated refmap (covers clean
        // builds where patchBrokenPrecompiledClasses ran before any refmap existed). Patches both
        // .precompiled and build/classes/java/main/sg/mx so remapJar picks up the renamed fields.
        exec {
            commandLine(
                javaExec,
                "-Dfile.encoding=UTF-8",
                "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar",
                "PatchShadowFieldNames"
            )
        }
    }
}

tasks.named("classes") {
    dependsOn("syncPrecompiledClasses")
    dependsOn("generateMixinRefmap")
}

tasks.named("remapJar") {
    dependsOn("generateMixinRefmap")
    dependsOn("forceCopyMixins")
    dependsOn("forceCopySgEc")
    finalizedBy("injectRefmap")
    doFirst {
        // Ensure ALL precompiled sg/mx classes are in build/classes before remapJar
        def srcDir = file(".precompiled/sg/mx")
        def dstDir = file("build/classes/java/main/sg/mx")
        def skipIfCompiled = ["OverlayTextureMixin.class", "ModuleHelper.class", "EquipmentRendererMixin.class", "LivingEntityRendererChamsMixin.class", "NetworkManagerMixin.class", "ChamsRenderer.class", "KeybindElement.class", "ScoreboardHudModule.class", "GameRendererMixin.class"]
        if (srcDir.exists()) {
            dstDir.mkdirs()
            srcDir.eachFile { f ->
                if (f.name.endsWith(".class")) {
                    def target = new File(dstDir, f.name)
                    if (!skipIfCompiled.contains(f.name) || !target.exists()) {
                        target.bytes = f.bytes
                    }
                }
            }
            logger.lifecycle("Pre-remapJar: copied sg/mx classes to build/classes")
        }
        // Patch build/classes/java/main/sg/mx mixins to Intermediary for production jar
        def javaExec = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get().executablePath.asFile.absolutePath
        exec {
            commandLine(javaExec, "-Dfile.encoding=UTF-8", "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar", "PatchAllToIntermediary", "build/classes/java/main/sg/mx")
        }
        logger.lifecycle("Pre-remapJar: patched build/classes/java/main/sg/mx to Intermediary")
    }
    doLast {
        def javaExec = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get().executablePath.asFile.absolutePath
        exec {
            commandLine(javaExec, "-Dfile.encoding=UTF-8", "-cp", "tools_out${File.pathSeparator}tools_out/asm-all.jar", "PatchAllToNamed", "build/classes/java/main/sg/mx")
        }
        logger.lifecycle("Post-remapJar: restored build/classes/java/main/sg/mx to Named format")
    }
}

